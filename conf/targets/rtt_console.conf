# =============================================================================
# 目标环境 — SEGGER RTT 控制台（J-Link RTT Viewer / JLinkRTTClient）
# =============================================================================
#
# 用途：控制台、Shell、日志后端全部切换到 RTT，不占用板载调试串口。
#       适用于通过 J-Link 调试/查看输出的板子（如 MIMXRT1064-EVK）。
#
# 用法（叠加在默认构建之上，EXTRA_CONF_FILE 在合并链最后应用，
#       可覆盖 standard.conf 中的 UART 控制台/日志默认值）：
#   west build -b mimxrt1064_evk . -d build_rt1064 -p always -- \
#     -DEXTRA_CONF_FILE=conf/targets/rtt_console.conf
#
# 说明：通道 0 = 日志 + banner（RTT Viewer 默认 Terminal 直接可见，缓冲在 DTCM）；
#       通道 1 = shell 交互（缓冲随 .bss 落 SDRAM，使用时把 RTT Viewer 的
#       Terminal Channel 切到 1）。分通道是 Zephyr 编译期断言的硬要求（禁止
#       shell 与日志共用上行通道）；通道 0 放日志是因本板控制块在 DTCM、
#       非 0 通道缓冲随 .bss 落 SDRAM，而板上取证（J-Link 直读内存）确认
#       通道 1 + SDRAM 缓冲写入正常且 RdOff 已被主机读走，RTT Viewer 却不
#       在 Terminal 显示，故日志放必然可见的通道 0。
# =============================================================================

# 关闭 UART 控制台 / UART 日志后端 / UART shell 后端
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_UART=n
CONFIG_SHELL_BACKEND_SERIAL=n

# 启用 SEGGER RTT：控制台、shell 后端、日志后端
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_SHELL_BACKEND_RTT=y
CONFIG_LOG_BACKEND_RTT=y

# 上行缓冲加大到 2048 字节，缓解主机读取慢时的日志丢行（默认 1024）
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=2048

# -----------------------------------------------------------------------------
# 关闭 shell 日志后端：它与 LOG_MODE_IMMEDIATE=y（standard.conf 默认）互斥，
# 不关闭会导致 SHELL_BACKEND_RTT 被 Kconfig 依赖检查降级为 n。
# 日志输出不受影响：仍由 CONFIG_LOG_BACKEND_RTT=y 走 RTT 通道 0。
# -----------------------------------------------------------------------------
CONFIG_SHELL_LOG_BACKEND=n

# -----------------------------------------------------------------------------
# shell 后端改走 RTT 通道 1：shell 与日志后端默认都占用通道 0，Zephyr 以
# 编译期 BUILD_ASSERT 禁止共用（见 subsys/shell/backends/shell_rtt.c）。
# 日志留在通道 0（RTT Viewer 默认 Terminal 直接可见），shell 移到通道 1，
# 使用时把 RTT Viewer 的 Terminal Channel 切到 1。
# -----------------------------------------------------------------------------
CONFIG_SHELL_BACKEND_RTT_BUFFER=1

# -----------------------------------------------------------------------------
# 额外产出 zephyr.hex：mimxrt1064_evk 默认只生成 .bin，补开 Intel HEX
# 便于 J-Link Commander 等烧录工具直接使用。仅影响产物格式，无运行时影响。
# -----------------------------------------------------------------------------
CONFIG_BUILD_OUTPUT_HEX=y

# -----------------------------------------------------------------------------
# 关闭 M7 D-Cache：RTT 非 0 通道的上行缓冲随 .bss 落在 SDRAM（本板
# zephyr,sram=sdram0，即通道 1 的 shell 缓冲），Cortex-M7 写回式 D-Cache
# 会让调试器读到旧数据；DTCM 不经 cache，控制块与通道 0（日志）不受影响。
# Zephyr 的 SEGGER RTT 移植不做 cache 维护，只能整体关闭 D-Cache。代价是
# SDRAM 访问不缓存、性能下降，仅适用于 RTT 验证目标；指令缓存（I-Cache）
# 保持开启。
# -----------------------------------------------------------------------------
CONFIG_DCACHE=n
