# 订阅级过滤 / Sticky 事件特性叠加层（须与 prj.conf;prj_test_extensions.conf 联用）
# native_sim / qemu: -DCONF_FILE="prj.conf;prj_test_extensions.conf;prj_event_ext.conf"
# 用法：tests/CMakeLists.txt 依 CONFIG_EVENT_SUBSCRIBER_FILTER / CONFIG_EVENT_STICKY 条件编入对应测试

# ---- 订阅级过滤（B1）----
CONFIG_EVENT_SUBSCRIBER_FILTER=y
CONFIG_EVENT_SUBSCRIBER_FILTER_SLOTS=16
CONFIG_EVENT_SUBSCRIBER_FILTER_STATS=y

# ---- Sticky 事件（B2）----
CONFIG_EVENT_STICKY=y
# 槽池固定为 4：test_event_sticky 依赖「第 5 个类型启用返回 NOT_FOUND」的负测
CONFIG_EVENT_STICKY_MAX_TYPES=4

# ---- 延迟/周期发布定时器池（B3）----
CONFIG_EVENT_TIMER_POOL=y
# 槽池固定为 8：test_event_timer 依赖「第 9 个提交返回 NO_MEM」的负测
CONFIG_EVENT_TIMER_SLOTS=8
CONFIG_EVENT_PERIODIC_PUBLISH=y
# 开启内存调试以便泄漏断言走 event_check_leaks 真实计数
CONFIG_EVENT_DEBUG_MEM=y

# ---- 优先级有序分发（B4）----
CONFIG_EVENT_PRIORITY_DISPATCH=y
# aging 步长保持默认 100ms：test_event_priority 的饿死界/提档窗口按此值推导
CONFIG_EVENT_PRIORITY_AGING_STEP_MS=100
# reorder scratch（2x 队列容量 x64B=8KB）+ 分发器批缓冲（4KB）需额外堆，
# 与 sticky/timer 负载副本叠加后 16KB 不足，放宽到 32KB
CONFIG_HEAP_MEM_POOL_SIZE=32768
