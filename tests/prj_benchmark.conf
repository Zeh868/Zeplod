# 事件基准模块 ztest 冒烟叠加层（须与 prj.conf 联用）
# west build -b <board> tests/ --build-dir build_bench_tests -p always -- \
#   -DCONF_FILE="prj.conf;prj_benchmark.conf"
# 用途：CI 非门禁冒烟步骤与本地构建验证配套 tests/test_event_benchmark.c；
# 仅结构性断言，不含绝对时序断言。

CONFIG_EVENT_BENCHMARK=y

# 测试环境无 shell：关闭 bench shell 命令，避免把 shell 源文件拉进测试构建
CONFIG_EVENT_BENCHMARK_SHELL=n

# 冒烟仅 16 次迭代，样本缓冲 64 已足够（默认 5000 需约 40KB 静态 RAM）
CONFIG_EVENT_BENCHMARK_MAX_SAMPLES=64

# 4KB 数据档在 EVENT_SLAB_LARGE_ENABLE=n（见 prj.conf）下走 k_malloc 回退，
# 单次 3000B 负载需要堆余量，按 CI 冒烟环境放宽
CONFIG_HEAP_MEM_POOL_SIZE=32768
