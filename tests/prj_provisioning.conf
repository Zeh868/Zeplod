# provisioning_module 单元测试叠加层
# west build ... -- -DCONF_FILE="prj.conf;prj_provisioning.conf"

CONFIG_PROVISIONING_MODULE=y
CONFIG_PROVISIONING_MODULE_AUTOINIT=n
CONFIG_PROVISIONING_DEVICE_ID="zeplod-test-unit-01"
# 凭据经 app_kv 持久化（RAM，PERSIST 默认关）：启用后 reset 删除凭据用例才有真实覆盖
CONFIG_APP_KV_ENABLE=y
CONFIG_EVENT_SYSTEM=y
