# Data Bus fixed-pool profile: every slab tier is present, and k_malloc is off.
# 64/256 档至少盖住默认队列深度，否则队列满测试会先碰到 -ENOMEM。
CONFIG_DATA_BUS_NO_MALLOC=y
CONFIG_DATA_BUS_SLAB_ENABLE=y
CONFIG_DATA_BUS_MAX_BLOCKS=48
CONFIG_DATA_BUS_SLAB_64_COUNT=16
CONFIG_DATA_BUS_SLAB_128_COUNT=2
CONFIG_DATA_BUS_SLAB_256_COUNT=16
CONFIG_DATA_BUS_SLAB_512_COUNT=2
CONFIG_DATA_BUS_SLAB_1K_COUNT=2
CONFIG_DATA_BUS_SLAB_4K_COUNT=1
